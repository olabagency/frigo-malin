name: Release

# Publier une release GitHub nommée v1.2.3 déclenche ce workflow.
# HACS lit les releases et propose alors la mise à jour dans Home Assistant.

on:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que le tag correspond à la version du code
        run: python3 scripts/check_version.py "${GITHUB_REF_NAME#v}"
