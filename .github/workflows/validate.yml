name: Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/check_version.py
      - run: pip install -r requirements_test.txt
      - name: Installer l'interface web de HA (même version que HA)
        run: |
          REQ=$(python -c "import json, os, homeassistant.components.frontend as f; print(json.load(open(os.path.join(os.path.dirname(f.__file__), 'manifest.json')))['requirements'][0])")
          pip install "$REQ"
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/frigo_malin/frontend/frigo-malin-panel.js
